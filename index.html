<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Touquet 2027</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ccircle cx=%278%27 cy=%278%27 r=%277%27 fill=%27white%27/%3E%3C/svg%3E" />
  </head>
  <body>
    <input type="file" id="fileInput" accept="image/*" hidden />
    <input type="file" id="audioInput" accept="audio/mpeg,.mp3" hidden />

    <div id="app">
      <aside class="panel" id="sidebar">
        <div class="cols">
          <div class="col">
            <div class="titles">
              <section class="group titled">
                <span class="title">Format</span>
                <div class="hug" id="formatSeg">
                  <button type="button" class="btn active" data-format="4:5" title="1080 x 1350">4:5</button>
                  <button type="button" class="btn" data-format="1:1" title="1080 x 1080">1:1</button>
                  <button type="button" class="btn" data-format="16:9" title="1920 x 1080">16:9</button>
                  <button type="button" class="btn" data-format="9:16" title="1080 x 1920">9:16</button>
                </div>
              </section>
              <section class="group titled">
                <span class="title">Layout Preset</span>
                <div class="hug" id="layoutSeg">
                  <button type="button" class="btn active" data-layout="reveal" title="Reveal: the stripes open and close around the labels">1</button>
                  <button type="button" class="btn" data-layout="none" title="No blocks">2</button>
                  <button type="button" class="btn" data-layout="row" title="Block row: thin strips at the top and bottom">3</button>
                  <button type="button" class="btn" data-layout="side" title="Side blocks">4</button>
                </div>
              </section>
            </div>

            <section class="group">
              <label class="row field"><span class="lbl">Day</span><input type="text" id="dayText" spellcheck="false" /></label>
              <div class="row field">
                <span class="lbl">Time</span>
                <div class="pair">
                  <input type="text" id="timeStartText" class="w45 center" spellcheck="false" />
                  <input type="text" id="timeEndText" class="w45 center" spellcheck="false" />
                </div>
              </div>
              <div class="row field">
                <span class="lbl" id="artistLbl">Artist</span>
                <div class="with-btn">
                  <input type="text" id="artistText" spellcheck="false" />
                  <button type="button" class="btn w20" id="artist2AddBtn" title="Add a second artist (B2B)">+</button>
                </div>
              </div>
              <div class="row field" id="artist2Row" hidden>
                <span class="lbl">Artist 2</span>
                <div class="with-btn">
                  <input type="text" id="artist2Text" spellcheck="false" />
                  <button type="button" class="btn w20" id="artist2RemoveBtn" title="Remove the second artist">&ndash;</button>
                </div>
              </div>
              <label class="row field"><span class="lbl">Stage</span><input type="text" id="stageText" spellcheck="false" /></label>
              <label class="row field tall"><span class="lbl">Info</span><textarea id="infoText" rows="2" spellcheck="false" placeholder=""></textarea></label>
              <div class="row field">
                <span class="lbl">Image</span>
                <div class="seg">
                  <button type="button" class="btn" id="imageLoadBtn" title="Or drop an image on the preview">Load</button>
                  <button type="button" class="btn" id="imageRemoveBtn" disabled>Remove</button>
                </div>
              </div>
              <div class="row field">
                <span class="lbl">Music</span>
                <div class="seg">
                  <button type="button" class="btn" id="audioLoadBtn" title="An MP3; drag the strip above the card to set where it starts">Load</button>
                  <button type="button" class="btn" id="audioRemoveBtn" disabled>Remove</button>
                </div>
              </div>
              <div class="row field" id="logoRow" hidden>
                <span class="lbl">Logo</span>
                <div class="seg" id="logoSeg">
                  <button type="button" class="btn active" data-logo="off">Off</button>
                  <button type="button" class="btn" data-logo="top">Top</button>
                  <button type="button" class="btn" data-logo="bottom">Bottom</button>
                </div>
                <div class="seg colour" id="logoColorSeg" hidden>
                  <button type="button" class="btn active" data-logocolor="black">Black</button>
                  <button type="button" class="btn" data-logocolor="white">White</button>
                </div>
              </div>
            </section>

            <section class="group" id="timingGroup"></section>

            <section class="group" id="rowsGroup"></section>

            <section class="group" id="shapeGroup">
              <div class="seg" id="orderSeg">
                <button type="button" class="btn" data-order="top">Top</button>
                <button type="button" class="btn" data-order="bottom">Bottom</button>
                <button type="button" class="btn active" data-order="center">Centre</button>
              </div>
            </section>
          </div>

          <div class="col right">
            <div class="stack">
              <section class="group" id="blocksGroup"></section>

              <section class="group" id="floatGroup"></section>

              <section class="group" id="colorGroup"></section>

              <section class="group">
                <div class="row field">
                  <span class="lbl">Loops</span>
                  <div class="seg" id="loopsSeg" title="How many times the loop plays in the MP4, for longer music">
                    <button type="button" class="btn active" data-loops="1">1x</button>
                    <button type="button" class="btn" data-loops="2">2x</button>
                    <button type="button" class="btn" data-loops="4">4x</button>
                  </div>
                </div>
                <div class="seg">
                  <button type="button" class="btn" id="copySettingsBtn">Copy Settings</button>
                  <button type="button" class="btn" id="pasteSettingsBtn">Paste Settings</button>
                </div>
                <div class="seg">
                  <button type="button" class="btn" id="exportMp4Btn" title="One full loop as H.264 MP4, 2160 wide at 60 fps">Export MP4</button>
                  <button type="button" class="btn" id="exportPngBtn" title="The frame shown in the preview, at 2x">Export PNG</button>
                </div>
              </section>
            </div>
            <footer class="foot">
              <span class="lbl">Motion Tool</span>
              <span class="lbl">Touquet 2027</span>
            </footer>
          </div>
        </div>
      </aside>

      <main class="preview" id="preview">
        <div class="timeline wave" id="wave" hidden>
          <button type="button" class="frame" id="waveTime" title="Where the music starts; drag the strip to move it">0:00</button>
          <div class="ticks" id="waveTicks"></div>
        </div>
        <div class="stage" id="stage">
          <canvas id="canvas" width="1080" height="1350"></canvas>
        </div>
        <div class="timeline" id="timeline">
          <button type="button" class="frame" id="frameBtn" title="Play / pause (Space). Arrow keys step a frame, Shift+arrow ten, Home restarts">0</button>
          <div class="ticks" id="ticks"></div>
        </div>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
